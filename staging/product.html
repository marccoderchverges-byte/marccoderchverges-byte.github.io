<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    color: #444444;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4em;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  .product-layout{
    max-width: 1080px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: clamp(32px, 6vh, 64px) clamp(20px, 4vw, 48px) clamp(64px, 10vh, 120px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(28px, 5vw, 64px);
    align-items: start;
  }

  .gallery{
    max-height: 82vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vw, 18px);
    scrollbar-width: thin;
  }

  .gallery img{
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    background: #f2f2f2;
  }

  .details{
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.4vh, 20px);
    padding-top: clamp(4px, 1vh, 12px);
  }

  .detail-row{
    display: flex;
    justify-content: space-between;
    gap: 1.5em;
    padding-bottom: clamp(10px, 2vh, 16px);
    border-bottom: 1px solid #e6e6e6;
    font-size: clamp(0.74rem, 1.5vw, 0.86rem);
  }

  .detail-row .label{
    color: #444444;
    white-space: nowrap;
  }

  .detail-row .value{
    text-align: right;
  }

  .swatch{
    display: inline-block;
    width: 0.85em;
    height: 0.85em;
    border-radius: 50%;
    margin-right: 0.35em;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.12);
  }

  .pantone-line{
    display: block;
    line-height: 1.6;
  }

  .price-row{
    border-bottom: none;
    font-size: clamp(0.86rem, 1.8vw, 1rem);
    margin-top: 0.2em;
  }

  .buy-btn{
    margin-top: clamp(6px, 1.5vh, 14px);
    font-family: inherit;
    font-weight: 400;
    font-size: clamp(0.78rem, 1.6vw, 0.9rem);
    padding: 0.85em 1.2em;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #ffffff;
    text-align: center;
    line-height: 1.5;
    cursor: default;
  }

  .stripe-note{
    display: block;
    font-size: 0.7em;
    color: #cccccc;
    margin-top: 0.15em;
  }

  @media (max-width: 700px){
    .product-layout{
      grid-template-columns: 1fr;
    }
    .gallery{
      max-height: none;
      overflow-y: visible;
    }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="catalogue.html">Back</a>
</div>

<div class="product-layout">
  <div class="gallery" id="gallery"></div>
  <div class="details">
    <div class="detail-row"><span class="label">Serial No.</span><span class="value" id="pSerial"></span></div>
    <div class="detail-row"><span class="label">Coordinates</span><span class="value" id="pCoords"></span></div>
    <div class="detail-row"><span class="label">Pantone</span><span class="value" id="pPantone"></span></div>
    <div class="detail-row"><span class="label">Weight</span><span class="value" id="pWeight"></span></div>
    <div class="detail-row"><span class="label">Size</span><span class="value" id="pSize"></span></div>
    <div class="detail-row"><span class="label">Hardness</span><span class="value" id="pHardness"></span></div>
    <div class="detail-row"><span class="label">Stone</span><span class="value" id="pType"></span></div>
    <div class="detail-row price-row"><span class="label">Price</span><span class="value" id="pPrice"></span></div>
    <button type="button" class="buy-btn" aria-disabled="true">
      Buy
      <span class="stripe-note">Powered by Stripe</span>
    </button>
  </div>
</div>

<script src="stones-data.js"></script>
<script>
  // Soft gate: this page only makes sense reached from an unlocked
  // Shop, so keep it behind the same placeholder check.
  try{
    if(sessionStorage.getItem("catalogue-unlocked") !== "1"){
      window.location.replace("catalogue.html");
    }
  }catch(e){}

  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var stone = STONES.find(function(s){ return s.id === id; }) || STONES[0];

  var imgs = stone.imgs || [stone.img];
  var galleryEl = document.getElementById("gallery");
  imgs.forEach(function(src, i){
    var img = document.createElement("img");
    img.src = src;
    img.alt = "Stone " + stone.id + (imgs.length > 1 ? " — photo " + (i + 1) : "");
    img.loading = i === 0 ? "eager" : "lazy";
    galleryEl.appendChild(img);
  });

  document.getElementById("pSerial").textContent = stone.serial;
  document.getElementById("pCoords").textContent = stone.coords;
  document.getElementById("pWeight").textContent = stone.weight;
  document.getElementById("pSize").textContent = stone.size;
  document.getElementById("pHardness").textContent = stone.hardness;
  document.getElementById("pType").textContent = stone.type;
  document.getElementById("pPrice").textContent = stone.price;

  var pantoneEl = document.getElementById("pPantone");
  pantoneEl.innerHTML = stone.pantones.map(function(p){
    return '<span class="pantone-line"><span class="swatch" style="background:' + p.hex + '"></span>' + p.name + ' (' + p.code + ')</span>';
  }).join("");

  document.title = "Stone " + stone.serial + " — Marc Coderch";
</script>

</body>
</html>
