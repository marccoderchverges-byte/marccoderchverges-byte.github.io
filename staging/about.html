<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  main{
    width: 100%;
    max-width: 720px;
    box-sizing: border-box;
    padding: clamp(48px, 8vh, 96px) 1.5rem clamp(64px, 10vh, 120px);
  }

  .section-title{
    margin: 0 0 clamp(24px, 4vh, 40px);
    text-align: center;
    font-weight: 400;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    color: #444444;
  }

  .about-photo-wrap{
    margin: 0 auto clamp(32px, 6vh, 56px);
    text-align: center;
  }

  .about-photo{
    width: 100%;
    aspect-ratio: 4 / 5;
    max-width: 340px;
    margin: 0 auto;
    background: #f2f2f2;
    object-fit: cover;
    display: block;
    filter: drop-shadow(0 14px 20px rgba(0,0,0,0.08));
  }

  .about-caption{
    margin-top: clamp(10px, 2vh, 16px);
    font-weight: 400;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    color: #444444;
  }

</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<main>
  <div class="section-title">About</div>
  <div class="about-photo-wrap">
    <img class="about-photo" src="about-photo.jpg" alt="Marc Coderch">
    <div class="about-caption">Barcelona, 1994</div>
  </div>
</main>

</body>
</html>
