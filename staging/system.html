<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  .section-title{
    width: 100%;
    box-sizing: border-box;
    margin: 0;
    padding: clamp(48px, 8vh, 96px) 1.5rem clamp(32px, 6vh, 56px);
    text-align: center;
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .process-strip{
    width: 100%;
    box-sizing: border-box;
    padding: 0 clamp(12px, 2vw, 24px);
    margin-bottom: clamp(48px, 8vh, 96px);
  }

  .process-track{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(12px, 2vw, 24px);
  }

  .process-photo{
    height: clamp(240px, 30vw, 460px);
    width: auto;
    display: block;
    object-fit: cover;
    background: #f2f2f2;
  }

  .site-footer{
    width: 100%;
    margin-top: auto;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(24px, 4vh, 40px) 1.5rem clamp(32px, 5vh, 56px);
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .site-footer a{
    color: inherit;
    text-decoration: none;
  }

  .site-footer a:hover{
    text-decoration: underline;
  }


  .cookie-banner{
    position: fixed;
    left: clamp(12px, 3vw, 22px);
    bottom: clamp(12px, 3vh, 22px);
    z-index: 9999;
    max-width: 240px;
    box-sizing: border-box;
    padding: 0.75em 0.9em;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5em;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid #e6e6e6;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    font-size: clamp(0.64rem, 1.1vw, 0.72rem);
    line-height: 1.4;
    color: #444444;
    text-align: left;
  }

  .cookie-banner.is-hidden{
    display: none;
  }

  .cookie-banner .cookie-text a{
    color: inherit;
    text-decoration: underline;
  }

  .cookie-banner .cookie-accept{
    color: #1a1a1a;
    text-decoration: underline;
    white-space: nowrap;
    cursor: pointer;
  }

  .cookie-banner .cookie-accept:hover{
    text-decoration: none;
  }

  @media (max-width: 700px){
    .cookie-banner{
      left: 50%;
      bottom: clamp(14px, 3vh, 24px);
      transform: translateX(-50%);
      max-width: min(88vw, 380px);
      width: max-content;
      align-items: center;
      text-align: center;
      padding: 1em 1.3em;
      font-size: clamp(0.8rem, 3.6vw, 0.94rem);
      gap: 0.65em;
    }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<div class="section-title">System</div>

<div class="process-strip">
  <div class="process-track">
    <img class="process-photo" src="fotos/process/process-01.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-02.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-03.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-04.jpg" alt="Proces">
  </div>
</div>

<footer class="site-footer">
  <a href="contact.html">Contact</a>
</footer>


<div id="cookieBanner" class="cookie-banner">
  <span class="cookie-text">This site uses cookies to improve your experience. <a href="privacy.html">Privacy Policy</a></span>
  <a href="#" id="cookieAccept" class="cookie-accept">Accept</a>
</div>

<script>
  (function(){
    var KEY = "cookieConsent";
    var banner = document.getElementById("cookieBanner");
    if(!banner) return;
    try{
      if(localStorage.getItem(KEY) === "accepted"){
        banner.classList.add("is-hidden");
        return;
      }
    }catch(e){}
    var acceptBtn = document.getElementById("cookieAccept");
    acceptBtn.addEventListener("click", function(e){
      e.preventDefault();
      banner.classList.add("is-hidden");
      try{ localStorage.setItem(KEY, "accepted"); }catch(e){}
    });
  })();
</script>
</body>
</html>
