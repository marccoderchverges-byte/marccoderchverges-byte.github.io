<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  .section-title{
    width: 100%;
    box-sizing: border-box;
    margin: 0;
    padding: clamp(48px, 8vh, 96px) 1.5rem clamp(32px, 6vh, 56px);
    text-align: center;
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .process-strip{
    width: 100%;
    overflow: hidden;
    margin-bottom: clamp(48px, 8vh, 96px);
  }

  .process-track{
    display: flex;
    width: max-content;
    gap: clamp(12px, 2vw, 24px);
    animation: process-scroll 14s linear infinite;
  }

  .process-photo{
    height: clamp(240px, 30vw, 460px);
    width: auto;
    display: block;
    object-fit: cover;
    background: #f2f2f2;
  }

  @keyframes process-scroll{
    from{ transform: translateX(-50%); }
    to{ transform: translateX(0%); }
  }

  .site-footer{
    width: 100%;
    margin-top: auto;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(24px, 4vh, 40px) 1.5rem clamp(32px, 5vh, 56px);
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .site-footer a{
    color: inherit;
    text-decoration: none;
  }

  .site-footer a:hover{
    text-decoration: underline;
  }

</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<div class="section-title">System</div>

<div class="process-strip">
  <div class="process-track">
    <img class="process-photo" src="fotos/process/process-01.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-02.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-03.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-04.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-05.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-01.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-02.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-03.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-04.jpg" alt="Proces">
    <img class="process-photo" src="fotos/process/process-05.jpg" alt="Proces">
  </div>
</div>

<footer class="site-footer">
  <a href="contact.html">Contact</a>
</footer>

</body>
</html>
