<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
  }

  .top-nav{
    position: fixed;
    top: clamp(20px, 4vh, 40px);
    left: 0;
    right: 0;
    box-sizing: border-box;
    padding: 0 1.5rem;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  .contact-info{
    box-sizing: border-box;
    padding: 0 1.5rem;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    line-height: 1.7;
    color: #444444;
  }

  .contact-info a{
    color: inherit;
    text-decoration: none;
  }

  .contact-info a:hover{
    text-decoration: underline;
  }


  .cookie-banner{
    position: fixed;
    left: clamp(12px, 3vw, 22px);
    bottom: clamp(12px, 3vh, 22px);
    z-index: 9999;
    max-width: 240px;
    box-sizing: border-box;
    padding: 0.75em 0.9em;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5em;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid #e6e6e6;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    font-size: clamp(0.64rem, 1.1vw, 0.72rem);
    line-height: 1.4;
    color: #444444;
    text-align: left;
  }

  .cookie-banner.is-hidden{
    display: none;
  }

  .cookie-banner .cookie-text a{
    color: inherit;
    text-decoration: underline;
  }

  .cookie-banner .cookie-accept{
    color: #1a1a1a;
    text-decoration: underline;
    white-space: nowrap;
    cursor: pointer;
  }

  .cookie-banner .cookie-accept:hover{
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<div class="contact-info">
  Marc Coderch<br>
  Contact at <a href="mailto:marc.coderch.verges@gmail.com">marc.coderch.verges@gmail.com</a>
  &middot; <a href="tel:+34666167893">+34 666 167 893</a>
  &middot; <a href="https://instagram.com/coderch__online" target="_blank" rel="noopener">@coderch__online</a>
  &middot; Avinguda Fabregada 22, 08907 L'Hospitalet de Llobregat<br>
  <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms and Conditions</a>
</div>


<div id="cookieBanner" class="cookie-banner">
  <span class="cookie-text">This site uses cookies to improve your experience. <a href="privacy.html">Privacy Policy</a></span>
  <a href="#" id="cookieAccept" class="cookie-accept">Accept</a>
</div>

<script>
  (function(){
    var KEY = "cookieConsent";
    var banner = document.getElementById("cookieBanner");
    if(!banner) return;
    try{
      if(localStorage.getItem(KEY) === "accepted"){
        banner.classList.add("is-hidden");
        return;
      }
    }catch(e){}
    var acceptBtn = document.getElementById("cookieAccept");
    acceptBtn.addEventListener("click", function(e){
      e.preventDefault();
      banner.classList.add("is-hidden");
      try{ localStorage.setItem(KEY, "accepted"); }catch(e){}
    });
  })();
</script>
</body>
</html>
