  .dir-top{ grid-column: 2; grid-row: 1; }
  .dir-left{ grid-column: 1; grid-row: 2; justify-self: end; display: inline-block; min-width: 5.5em; text-align: right; }
  .dir-right{ grid-column: 3; grid-row: 2; justify-self: start; display: inline-block; min-width: 5.5em; text-align: left; }

  .stone-photo{

    grid-row: 2;
    width: clamp(190px, 32vw, 340px);

    color: #444444;
  }

  .bottom-contact a{
    color: inherit;
    text-decoration: none;
  }

    text-decoration: underline;
  }

<script>
  var stones = [
    "fotos/pedra-01.jpg",
    "fotos/pedra-02.jpg",
    "fotos/pedra-03.jpg",
    "fotos/pedra-04.jpg",
    "fotos/pedra-05.jpg",
    "fotos/pedra-06.jpg",
    "fotos/pedra-07.jpg",
    "fotos/pedra-08.jpg",
    "fotos/pedra-09.jpg",
    "fotos/pedra-10.jpg",
    "fotos/pedra-11.jpg",
    "fotos/pedra-12.jpg"
  ];

  (function initStone(){
    var STORAGE_KEY = "pedra-last-index";
    var last = -1;
    try{
      var stored = localStorage.getItem(STORAGE_KEY);
      if(stored !== null) last = parseInt(stored, 10);
    }catch(e){}

    var idx;
    if(stones.length <= 1){
      idx = 0;
    }else{
      do{
        idx = Math.floor(Math.random() * stones.length);
      }while(idx === last);
    }

    try{ localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){}

    document.getElementById("stoneImg").src = stones[idx];
  })();
</script>
