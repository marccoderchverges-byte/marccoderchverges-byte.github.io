<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
  }

  .layout{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(18px, 3.5vw, 48px);
    padding: 0 1.5rem;
    box-sizing: border-box;
    max-width: 100%;
  }

  .dir-link{
    font-family: inherit;
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
    text-decoration: none;
    white-space: nowrap;
  }

  .dir-link:hover{
    text-decoration: underline;
  }

  .top-shop{
    position: fixed;
    top: clamp(18px, 4vh, 44px);
    left: 0;
    right: 0;
    text-align: center;
  }

  .bottom-contact{
    position: fixed;
    bottom: clamp(18px, 4vh, 44px);
    left: 0;
    right: 0;
    text-align: center;
  }


  .cookie-banner{
    position: fixed;
    left: clamp(12px, 3vw, 22px);
    bottom: clamp(12px, 3vh, 22px);
    z-index: 9999;
    max-width: 240px;
    box-sizing: border-box;
    padding: 0.75em 0.9em;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5em;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid #e6e6e6;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    font-size: clamp(0.64rem, 1.1vw, 0.72rem);
    line-height: 1.4;
    color: #444444;
    text-align: left;
  }

  .cookie-banner.is-hidden{
    display: none;
  }

  .cookie-banner .cookie-text a{
    color: inherit;
    text-decoration: underline;
  }

  .cookie-banner .cookie-accept{
    color: #1a1a1a;
    text-decoration: underline;
    white-space: nowrap;
    cursor: pointer;
  }

  .cookie-banner .cookie-accept:hover{
    text-decoration: none;
  }
</style>

<div id="cookieBanner" class="cookie-banner">
  <span class="cookie-text">This site uses cookies to improve your experience. <a href="privacy.html">Privacy Policy</a></span>
  <a href="#" id="cookieAccept" class="cookie-accept">Accept</a>
</div>

<script>
  (function(){
    var KEY = "cookieConsent";
    var banner = document.getElementById("cookieBanner");
    if(!banner) return;
    try{
      if(localStorage.getItem(KEY) === "accepted"){
        banner.classList.add("is-hidden");
        return;
      }
    }catch(e){}
    var acceptBtn = document.getElementById("cookieAccept");
    acceptBtn.addEventListener("click", function(e){
      e.preventDefault();
      banner.classList.add("is-hidden");
      try{ localStorage.setItem(KEY, "accepted"); }catch(e){}
    });
  })();
</script>
</body>
