<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collaborations — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  main{
    width: 100%;
    max-width: 720px;
    box-sizing: border-box;
    padding: clamp(48px, 8vh, 96px) 1.5rem clamp(64px, 10vh, 120px);
    text-align: center;
  }

  .message{
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #1a1a1a;
  }

  .site-footer{
    width: 100%;
    margin-top: auto;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(24px, 4vh, 40px) 1.5rem clamp(32px, 5vh, 56px);
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .site-footer a{
    color: inherit;
    text-decoration: none;
  }

  .site-footer a:hover{
    text-decoration: underline;
  }

</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<main>
  <div class="message">Open to Collaborate, please reach out through email.</div>
</main>

<footer class="site-footer">
  <a href="contact.html">Contact</a>
</footer>

</body>
</html>
