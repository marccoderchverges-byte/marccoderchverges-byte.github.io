<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Marc Coderch</title>
<meta name="robots" content="noindex">

<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  main{
    width: 100%;
    max-width: 720px;
    box-sizing: border-box;
    padding: clamp(48px, 8vh, 96px) 1.5rem clamp(64px, 10vh, 120px);
    text-align: center;
  }

  .section-title{
    margin: 0 0 clamp(24px, 4vh, 40px);
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .placeholder{
    font-weight: 400;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #999999;
  }

  .site-footer{
    width: 100%;
    margin-top: auto;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(24px, 4vh, 40px) 1.5rem clamp(32px, 5vh, 56px);
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .site-footer a{
    color: inherit;
    text-decoration: none;
  }

  .site-footer a:hover{
    text-decoration: underline;
  }


  .cookie-banner{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    box-sizing: border-box;
    padding: 0.9em 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1.1em;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid #e6e6e6;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    font-size: clamp(0.72rem, 1.4vw, 0.84rem);
    color: #444444;
    text-align: center;
  }

  .cookie-banner.is-hidden{
    display: none;
  }

  .cookie-banner .cookie-text a{
    color: inherit;
    text-decoration: underline;
  }

  .cookie-banner .cookie-accept{
    color: #1a1a1a;
    text-decoration: underline;
    white-space: nowrap;
    cursor: pointer;
  }

  .cookie-banner .cookie-accept:hover{
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<main>
  <div class="section-title">Projects</div>
  <div class="placeholder">Coming soon.</div>
</main>

<footer class="site-footer">
  <a href="contact.html">Contact</a>
</footer>


<div id="cookieBanner" class="cookie-banner">
  <span class="cookie-text">This site uses cookies to improve your experience. <a href="privacy.html">Privacy Policy</a></span>
  <a href="#" id="cookieAccept" class="cookie-accept">Accept</a>
</div>

<script>
  (function(){
    var KEY = "cookieConsent";
    var banner = document.getElementById("cookieBanner");
    if(!banner) return;
    try{
      if(localStorage.getItem(KEY) === "accepted"){
        banner.classList.add("is-hidden");
        return;
      }
    }catch(e){}
    var acceptBtn = document.getElementById("cookieAccept");
    acceptBtn.addEventListener("click", function(e){
      e.preventDefault();
      banner.classList.add("is-hidden");
      try{ localStorage.setItem(KEY, "accepted"); }catch(e){}
    });
  })();
</script>
</body>
</html>
