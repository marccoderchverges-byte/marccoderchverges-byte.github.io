<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body{
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-weight: 400;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-nav{
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 4vh, 40px) 1.5rem 0;
    text-align: center;
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .top-nav a{
    color: inherit;
    text-decoration: none;
  }

  .top-nav a:hover{
    text-decoration: underline;
  }

  main{
    width: 100%;
    max-width: 960px;
    box-sizing: border-box;
    padding: 0 1.5rem;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .install-video{
    width: 100%;
    max-width: 900px;
    height: auto;
    display: block;
  }

  .site-footer{
    width: 100%;
    margin-top: auto;
    box-sizing: border-box;
    text-align: center;
    padding: clamp(24px, 4vh, 40px) 1.5rem clamp(32px, 5vh, 56px);
    font-size: clamp(0.74rem, 1.5vw, 0.88rem);
    color: #444444;
  }

  .site-footer a{
    color: inherit;
    text-decoration: none;
  }

  .site-footer a:hover{
    text-decoration: underline;
  }

</style>

<body>

<div class="top-nav">
  <a href="index.html">Back</a>
</div>

<main>
  <video class="install-video" id="installVideo" src="videos/pedra-v2.mp4" loop playsinline controls></video>
</main>

<footer class="site-footer">
  <a href="contact.html">Contact</a>
</footer>

<script>
  var v = document.getElementById('installVideo');
  var tryUnmutedPlay = function(){
    v.muted = false;
    var p = v.play();
    if (p && p.catch){
      p.catch(function(){
        v.muted = true;
        v.play().catch(function(){});
        var unmute = function(){
          v.muted = false;
          document.removeEventListener('click', unmute);
          document.removeEventListener('touchstart', unmute);
        };
        document.addEventListener('click', unmute, { once: true });
        document.addEventListener('touchstart', unmute, { once: true });
      });
    }
  };
  tryUnmutedPlay();
</script>

<script data-goatcounter="https://coderch.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
