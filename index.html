<title>Pedra</title>
<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Times New Roman", Times, Georgia, serif;
  }

  .stone-link{
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(150px, 26vw, 300px);
    aspect-ratio: 1 / 1;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stone-link:focus{
    outline: none;
  }
  .stone-link:focus-visible{
    outline: 1px solid #bbb;
    outline-offset: 12px;
  }

  .stone-svg{
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 14px 20px rgba(0,0,0,0.10));
  }

  .email{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 0.75rem;
    opacity: 0;
    font-size: clamp(0.85rem, 1.7vw, 1.15rem);
    letter-spacing: 0.01em;
    color: #1a1a1a;
    pointer-events: none;
  }

  .stone-link:hover .stone-svg,
  .stone-link:focus-visible .stone-svg,
  .stone-link.touched .stone-svg{
    opacity: 0;
  }

  .stone-link:hover .email,
  .stone-link:focus-visible .email,
  .stone-link.touched .email{
    opacity: 1;
  }
</style>
</head>

  (function initStone(){
    var STORAGE_KEY = "pedra-last-index";
    var last = -1;
    try{
      var stored = localStorage.getItem(STORAGE_KEY);
      if(stored !== null) last = parseInt(stored, 10);
    }catch(e){}

    var idx;
    if(stones.length <= 1){
      idx = 0;
    }else{
      do{
        idx = Math.floor(Math.random() * stones.length);
      }while(idx === last);
    }

    try{ localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){}

    var s = stones[idx];

    document.getElementById("stonePath").setAttribute("d", s.d);
    document.getElementById("stoneClipPath").setAttribute("d", s.d);
    document.getElementById("gradStop1").setAttribute("stop-color", s.colors[0]);
    document.getElementById("gradStop2").setAttribute("stop-color", s.colors[1]);
    document.getElementById("gradStop3").setAttribute("stop-color", s.colors[2]);

    var hl = document.getElementById("stoneHighlight");
    hl.setAttribute("cx", s.hl.cx);
    hl.setAttribute("cy", s.hl.cy);
    hl.setAttribute("rx", s.hl.rx);
    hl.setAttribute("ry", s.hl.ry);
    hl.setAttribute("transform", "rotate(" + s.hl.rot + " " + s.hl.cx + " " + s.hl.cy + ")");

    // Touch support: tapping toggles the reveal state before the mailto fires,
    // and a second tap outside clears it.
    var link = document.getElementById("stoneLink");
    link.addEventListener("touchstart", function(){
      link.classList.add("touched");
    }, {passive: true});
  })();
