<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedra</title>
<style>
  :root{
    color-scheme: light;
  }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Times New Roman", Times, Georgia, serif;
  }

  .stone-link{
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(190px, 32vw, 340px);
    aspect-ratio: 4 / 5;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stone-link:focus{
    outline: none;
  }
  .stone-link:focus-visible{
    outline: 1px solid #bbb;
    outline-offset: 12px;
  }

  .stone-img{
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    filter: drop-shadow(0 14px 20px rgba(0,0,0,0.14));
  }

  .email{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 0.75rem;
    opacity: 0;
    font-size: clamp(0.85rem, 1.7vw, 1.15rem);
    letter-spacing: 0.01em;
    color: #1a1a1a;
    background: #ffffff;
    pointer-events: none;
  }

  .stone-link:hover .stone-img,
  .stone-link:focus-visible .stone-img,
  .stone-link.touched .stone-img{
    opacity: 0;
  }

  .stone-link:hover .email,
  .stone-link:focus-visible .email,
  .stone-link.touched .email{
    opacity: 1;
  }

  .bottom-contact{
    position: fixed;
    bottom: clamp(18px, 4vh, 44px);
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 1.5rem;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    line-height: 1.7;
    color: #444444;
  }

  .bottom-contact a{
    color: inherit;
    text-decoration: none;
  }

  .bottom-contact a:hover{
    text-decoration: underline;
  }
</style>
</head>
<body>

<a href="mailto:marc.coderch.verges@gmail.com"
   class="stone-link"
   id="stoneLink"
   aria-label="Envia un correu a marc.coderch.verges@gmail.com">
  <img class="stone-img" id="stoneImg" src="" alt="" aria-hidden="true">
  <span class="email" id="emailLabel">marc.coderch.verges@gmail.com</span>
</a>

<div class="bottom-contact">
  Contact at <a href="mailto:marc.coderch.verges@gmail.com">marc.coderch.verges@gmail.com</a>
  &middot; <a href="tel:+34666167893">+34 666 167 893</a>
  &middot; <a href="https://instagram.com/coderch__online" target="_blank" rel="noopener">@coderch__online</a>
  &middot; Avinguda Fabregada 22, 08907 L'Hospitalet de Llobregat
</div>

<script>
  var stones = [
    "fotos/pedra-01.jpg",
    "fotos/pedra-02.jpg",
    "fotos/pedra-03.jpg",
    "fotos/pedra-04.jpg",
    "fotos/pedra-05.jpg",
    "fotos/pedra-06.jpg",
    "fotos/pedra-07.jpg",
    "fotos/pedra-08.jpg",
    "fotos/pedra-09.jpg",
    "fotos/pedra-10.jpg",
    "fotos/pedra-11.jpg",
    "fotos/pedra-12.jpg"
  ];

  (function initStone(){
    var STORAGE_KEY = "pedra-last-index";
    var last = -1;
    try{
      var stored = localStorage.getItem(STORAGE_KEY);
      if(stored !== null) last = parseInt(stored, 10);
    }catch(e){}

    var idx;
    if(stones.length <= 1){
      idx = 0;
    }else{
      do{
        idx = Math.floor(Math.random() * stones.length);
      }while(idx === last);
    }

    try{ localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){}

    document.getElementById("stoneImg").src = stones[idx];

    // Touch support: tapping toggles the reveal state before the mailto fires,
    // and a second tap outside clears it.
    var link = document.getElementById("stoneLink");
    link.addEventListener("touchstart", function(){
      link.classList.add("touched");
    }, {passive: true});
  })();
</script>

<script data-goatcounter="https://coderch.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
